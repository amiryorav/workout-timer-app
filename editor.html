<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Editor - Workout Timer</title>
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/editor.css">
</head>
<body>
  <header>
    <h1>Workout Editor</h1>
  </header>
  
  <main>
    <form id="workout-form">
      <div class="form-group">
        <label for="workout-name">Workout Name</label>
        <input type="text" id="workout-name" name="name" required placeholder="e.g., Upper Body">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="sets">Sets</label>
          <input type="number" id="sets" name="sets" min="1" max="10" value="3" required>
        </div>
        
        <div class="form-group">
          <label for="break-between-sets">Break Between Sets (seconds)</label>
          <input type="number" id="break-between-sets" name="breakBetweenSets" min="0" max="300" value="60" required>
        </div>
      </div>
      
      <div class="sections-container">
        <section class="workout-section">
          <h2>Warmup</h2>
          <div class="steps-container" id="warmup-steps"></div>
          <button type="button" class="btn add-step" data-section="warmup">Add Warmup Step</button>
        </section>
        
        <section class="workout-section">
          <h2>Main Sequence</h2>
          <div class="steps-container" id="sequence-steps"></div>
          <button type="button" class="btn add-step" data-section="sequence">Add Sequence Step</button>
        </section>
        
        <section class="workout-section">
          <h2>Cooldown</h2>
          <div class="steps-container" id="cooldown-steps"></div>
          <button type="button" class="btn add-step" data-section="cooldown">Add Cooldown Step</button>
        </section>
      </div>
      
      <div class="editor-actions">
        <button type="button" id="preview-workout" class="btn">Preview</button>
        <button type="button" id="save-workout" class="btn primary">Save Workout</button>
        <button type="button" id="cancel-edit" class="btn">Cancel</button>
      </div>
    </form>
    
    <div id="preview-container" class="hidden">
      <h2>Workout Preview</h2>
      <div id="preview-content"></div>
      <button type="button" id="close-preview" class="btn">Close Preview</button>
    </div>
  </main>
  
  <!-- Step Template (hidden, used by JavaScript) -->
  <template id="step-template">
    <div class="step" draggable="true">
      <div class="step-drag-handle">≡</div>
      <div class="step-type-container">
        <select class="step-type">
          <option value="exercise">Exercise</option>
          <option value="rest">Rest</option>
        </select>
      </div>
      <div class="step-name-container">
        <input type="text" class="step-name" placeholder="Step name">
      </div>
      <div class="step-duration-container">
        <input type="number" class="step-duration" min="1" max="300" value="30">
        <span>sec</span>
      </div>
      <button type="button" class="btn remove-step">×</button>
    </div>
  </template>
  
  <div id="dialog-container" class="hidden">
    <div class="dialog">
      <div class="dialog-content" id="dialog-content"></div>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn">Cancel</button>
        <button id="dialog-confirm" class="btn danger">Confirm</button>
      </div>
    </div>
  </div>
  
  <script type="module" src="scripts/editor.ts"></script>
</body>
</html>
